name: Publicar banco

# Aplica no Supabase de produção as migrações que entraram no ramo principal.
# Só roda depois que um Pull Request é aprovado e mesclado (merge).
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/publicar-banco.yml"]
  workflow_dispatch:

concurrency: publicar-banco

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Conferir segredos
        id: segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Segredos do Supabase ainda não cadastrados; nada foi publicado. Veja o README."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.segredos.outputs.pronto == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.segredos.outputs.pronto == 'true'
        with:
          version: 2.121.0
      - name: Aplicar migrações
        if: steps.segredos.outputs.pronto == 'true'
        run: |
          # O ID do projeto tem 20 letras minúsculas. Aceita também o segredo
          # colado com espaços ou como endereço (https://<id>.supabase.co ou o
          # link do painel), e extrai só o ID.
          ref=$(printf '%s' "$SUPABASE_PROJECT_ID" | tr -d '[:space:]' | grep -oE '(^|[^a-z])[a-z]{20}([^a-z]|$)' | grep -oE '[a-z]{20}' | head -n1 || true)
          if [ -z "$ref" ]; then
            echo "::error::O segredo SUPABASE_PROJECT_ID não contém um ID de projeto válido (20 letras minúsculas, como em Project Settings → General → Project ID). Ele tem ${#SUPABASE_PROJECT_ID} caracteres. Corrija o segredo no GitHub e rode este fluxo de novo."
            exit 1
          fi
          # A CLI também lê SUPABASE_PROJECT_ID do ambiente; passa só o ID limpo.
          export SUPABASE_PROJECT_ID="$ref"
          supabase link --project-ref "$ref" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
