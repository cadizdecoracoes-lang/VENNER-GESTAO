name: Publicar telas

# Gera o site estático (npm run build) e publica no GitHub Pages depois de cada
# merge no ramo principal. As telas falam direto com o Supabase pelo navegador:
# só precisam do endereço do projeto e da chave pública (publishable), lidos
# aqui com os mesmos segredos da publicação do banco.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-telas
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Endereço e chave pública do Supabase
        run: |
          # Mesmo tratamento do publicar-banco.yml: aceita o ID com sobras.
          ref=$(printf '%s' "$SUPABASE_PROJECT_ID" | tr -d '[:space:]' | grep -oE '(^|[^a-z])[a-z]{20}([^a-z]|$)' | grep -oE '[a-z]{20}' | head -n1 || true)
          if [ -z "$ref" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Faltam os segredos SUPABASE_PROJECT_ID e SUPABASE_ACCESS_TOKEN (os mesmos da publicação do banco)."
            exit 1
          fi
          chaves=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$ref/api-keys")
          chave=$(printf '%s' "$chaves" | jq -r '(map(select(.type == "publishable")) + map(select(.name == "anon")))[0].api_key // empty')
          if [ -z "$chave" ]; then
            echo "::error::Não achei a chave pública (publishable ou anon) do projeto no Supabase."
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$ref.supabase.co" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$chave" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Gerar o site
        env:
          # O GitHub Pages serve o site em /<nome do repositório>.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
