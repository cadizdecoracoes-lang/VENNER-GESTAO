name: Verificação

on:
  pull_request:
  push:
    branches: [main]

jobs:
  telas:
    name: Telas (tipos e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Testes do planejamento
        run: npm test
      - name: Site estático (como no GitHub Pages)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /VENNER-GESTAO

  funcoes:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Conferir tipos das funções
        run: |
          cd supabase/functions
          for f in */index.ts; do
            deno check --config "$(dirname "$f")/deno.json" "$f"
          done

  banco:
    name: Banco (migrações e regras de acesso)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migrações e rodar testes
        run: |
          for f in supabase/tests/00_stub_supabase.sql supabase/migrations/*.sql supabase/tests/[1-9]*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
